[project]
name = "jejakpeluang-backend"
version = "0.1.0"
description = "JejakPeluang API"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.141.1",
    "fastapi-users[sqlalchemy]==15.0.5",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "pwdlib[argon2]==0.3.0",
    "pydantic==2.13.5",
    "pypdf==6.19.0",
    "redis==8.1.0",
    "sqlalchemy==2.0.54",
    "trafilatura==2.2.0",
    "typesafe-sdk==0.7.0",
    "uvicorn[standard]==0.53.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: hits real OpenRouter/Tavily/TypeSafe APIs (needs JP_LIVE_TESTS=1 and provider keys)",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
