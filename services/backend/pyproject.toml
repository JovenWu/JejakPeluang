[project]
name = "jejakpeluang-backend"
version = "0.1.0"
description = "JejakPeluang API"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.141.1",
    "fastapi-users[sqlalchemy]==15.0.5",
    "psycopg[binary]==3.3.6",
    "pwdlib[argon2]==0.3.0",
    "pydantic==2.13.5",
    "sqlalchemy==2.0.54",
    "uvicorn[standard]==0.53.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]
