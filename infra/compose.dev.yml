name: jejakpeluang-dev

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://jejakpeluang_test:${TEST_DB_PASSWORD:?set_TEST_DB_PASSWORD}@postgres:5432/jejakpeluang_e2e
  UPLOAD_DIR: /data/uploads
  AUTH_SECRET: ${AUTH_SECRET:-jp-dev-auth-secret-change-me}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  RATE_LIMIT_SALT: ${RATE_LIMIT_SALT:-jp-dev-rate-limit-salt}
  REDIS_URL: redis://redis:6379/0
  JOB_BROKER: redis
  RATE_LIMITER: ${RATE_LIMITER:-memory}
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
  APP_ENV: ${APP_ENV:-development}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-6-luna}
  TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}

services:
  postgres:
    image: ${POSTGRES_IMAGE:?set_reviewed_POSTGRES_IMAGE_digest}
    environment:
      POSTGRES_USER: jejakpeluang_test
      POSTGRES_DB: jejakpeluang_e2e
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?set_TEST_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jejakpeluang_test"]
      interval: 5s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
      args:
        UV_IMAGE: ${UV_IMAGE:?set_reviewed_UV_IMAGE_digest}
    environment:
      <<: *backend-env
    volumes:
      - uploads:/data/uploads
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  redis:
    image: ${REDIS_IMAGE:?set_reviewed_REDIS_IMAGE_digest}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  worker:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
      args:
        UV_IMAGE: ${UV_IMAGE:?set_reviewed_UV_IMAGE_digest}
    command: ["uv", "run", "python", "-m", "app.worker"]
    environment:
      <<: *backend-env
      RENDERER_URL: http://renderer:9000
    volumes:
      - uploads:/data/uploads
    networks: [default, render]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      renderer:
        condition: service_healthy
    restart: unless-stopped
  # Headless Chromium for JavaScript-only pages. Lives on its own network
  # (reachable only by the worker; no route to postgres/redis/api) and
  # holds no secrets. Every browser request goes through the SSRF-hardened
  # fetcher; see services/backend/app/services/render.py.
  renderer:
    build:
      context: ..
      dockerfile: infra/docker/renderer.Dockerfile
      args:
        RENDERER_IMAGE: ${RENDERER_IMAGE:-mcr.microsoft.com/playwright/python:v1.62.0-noble@sha256:aa81288e738725378becba5b3e06cb0f3a7f012a610e87e8d767a090ea3f740d}
    networks: [render]
    init: true
    ipc: private
    shm_size: 512m
    mem_limit: 1g
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=2)"]
      interval: 10s
      retries: 6
    restart: unless-stopped
  sweeper:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
      args:
        UV_IMAGE: ${UV_IMAGE:?set_reviewed_UV_IMAGE_digest}
    command: ["sh", "-c", "while true; do uv run --no-sync python scripts/sweep_retention.py; sleep ${SWEEP_INTERVAL_SECONDS:-3600}; done"]
    environment:
      <<: *backend-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:?set_reviewed_NODE_IMAGE_digest}
        API_INTERNAL_ORIGIN: http://api:8000
    environment:
      API_INTERNAL_ORIGIN: http://api:8000
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      retries: 10
    depends_on:
      api:
        condition: service_healthy

networks:
  default:
  render:

volumes:
  uploads:
